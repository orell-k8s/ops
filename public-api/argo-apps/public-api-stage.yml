project: default
source:
  repoURL: git@github.com:orell-k8s/ops.git
  path: public-api/overlays/stage
  targetRevision: HEAD
destination:
  server: https://kubernetes.default.svc
  namespace: public-stage
syncPolicy:
  automated:
    prune: true
    selfHeal: true
    enabled: true
  syncOptions:
    - CreateNamespace=true


